<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="icon" href="./img/home-page/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Coffee House</title>
  </head>
  <body>
    <div class="container">
        <header class="header_container">
            <img class="logo_img" src="./img/home-page/logo.png" alt="logo coffee house">
            <nav>
                <ul class="header_list">
                    <li><a class="header_link" href="#favorite">Favorite coffee</a></li>
                    <li><a class="header_link" href="#about">About</a></li>
                    <li><a class="header_link" href="#mobile_app">Mobile app</a></li>
                    <li><a class="header_link" href="#contacts">Contact us</a></li>
                </ul>
            </nav>
            <div class="header_options">
            <div class="theme_switch">
                <div class="header_icons_container"><img class="sun_icon header_icons"  src="./img/icons/Sun.png" alt="sun icon to switch theme"></div>
                <div class="header_icons_container"><img class="moon_icon header_icons" src="./img/icons/Moon.svg" alt="moon icon to switch theme"></div>
            </div>
            <div class="menu_link">
                <a class="header_link" href="">Menu <img src="./img/icons/coffee-cup.png" alt="icon cup of coffee"></a>
            </div>
            </div>
        </header>
    </div>
    <script src="script.js"></script>
  </body>
</html>
