<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./menu.css" />
    <link rel="icon" href="./img/home-page/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Coffee House Menu</title>
  </head>
  <body>
    <div class="container">
      <header class="header_container">
        <a class="logo_link" href="./index.html">
          <img
            class="logo_img"
            src="./img/home-page/logo.png"
            alt="logo coffee house"
        /></a>
        <nav>
          <ul class="header_list">
            <li>
              <a class="header_link" href="./index.html#favorite"
                >Favorite coffee</a
              >
            </li>
            <li><a class="header_link" href="./index.html#about">About</a></li>
            <li>
              <a class="header_link" href="./index.html#mobile_app"
                >Mobile app</a
              >
            </li>
            <li><a class="header_link" href="#contacts">Contact us</a></li>
          </ul>
        </nav>
        <div class="header_options">
          <div class="theme_switch">
            <button
              class="header_icons_container sun_icon"
              aria-label="sun icon to switch theme"
              type="button"
            ></button>
            <button
              class="header_icons_container moon_icon"
              aria-label="sun icon to switch theme"
              type="button"
            ></button>
          </div>
          <div class="menu_link">
            <a class="header_link" href=""
              >Menu
              <img src="./img/icons/coffee-cup.png" alt="icon cup of coffee"
            /></a>
          </div>
        </div>
      </header>
      <main>
        <section class="menu_container">
          <h2 class="menu_title">
            Behind each of our cups hides an
            <span class="hightlight_text">amazing surprise</span>
          </h2>
          <div class="tabs_container">
            <button
              class="tab_item active"
              type="button"
              aria-label="switch tab"
            >
              <div class="icon_container">
                <img
                  class="tab_icon"
                  src="./img/icons/coffe.png"
                  alt="cup of coffee icon"
                />
              </div>
              <p class="tab_title">Coffee</p>
            </button>
            <button class="tab_item" type="button" aria-label="switch tab">
              <div class="icon_container">
                <img
                  class="tab_icon"
                  src="./img/icons/tea.png"
                  alt="coffee pot icon"
                />
              </div>
              <p class="tab_title">Tea</p>
            </button>
            <button class="tab_item" type="button" aria-label="switch tab">
              <div class="icon_container">
                <img
                  class="tab_icon"
                  src="./img/icons/dessert.png"
                  alt="cake slice icon "
                />
              </div>
              <p class="tab_title">Dessert</p>
            </button>
          </div>
          <div class="menu_grid">
            <!--
                        <div class="menu_card">
              <div class="menu_img_container">
                              <img class="img_card" src="./img/menu-page/coffee-1.jpg"
              alt="">
              </div>
              <div class="description">
                <h3 class="card_description_title">Irish coffee</h3>
                <p class="card_description_text">Fragrant black coffee with Jameson Irish whiskey and whipped milk</p>
                <p class="card_description_price">$7.00</p>
              </div>
            </div>
            -->
          </div>
        </section>
      </main>
      <footer class="footer_container" id="contacts">
        <div class="contacts_offer">
          <h2 class="contacts_title">
            Sip, Savor, Smile.
            <span class="hightlight_text">It’s coffee time!</span>
          </h2>
          <div class="socials_container">
            <a href="https://x.com" target="_blank"
              ><div class="social_icons twitter_icon"></div
            ></a>
            <a
              href="https://www.instagram.com/reel/Db3Kr9Ftx0o/"
              target="_blank"
              ><div class="social_icons instagram_icon"></div
            ></a>
            <a href="https://www.facebook.com" target="_blank"
              ><div class="social_icons facebook_icon"></div
            ></a>
          </div>
        </div>
        <ul class="contacts_info">
          <li class="contacts_info_title">Contact us</li>
          <li>
            <a
              class="contacts_link"
              href="https://www.google.com/maps/place/Луизиана,+США/@30.9105342,-94.0417033,7z/data=!3m1!4b1!4m10!1m2!2m1!1s8558+Green+Rd.,+LA!3m6!1s0x8620a454b2118265:0xc955f73281e54703!8m2!3d30.5190775!4d-91.5208624!15sChI4NTU4IEdyZWVuIFJkLiwgTEGSAQh1c19zdGF0ZeABAA!16zL20vMDRseTE?entry=ttu&g_ep=EgoyMDI2MDkwOS4wIKXMDSoASAFQAw%3D%3D"
              target="_blank"
              ><img
                class="contact_icons pin_alt_icon"
                src="./img/icons/pin-alt.png"
                alt="pin alt icon"
              />8558 Green Rd., LA</a
            >
          </li>
          <li>
            <a class="contacts_link" href="tel:+16035550123" target="_blank"
              ><img
                class="contact_icons tel_icon"
                src="./img/icons/phone.png"
                alt="phone icon"
              />+1 (603) 555-0123</a
            >
          </li>
          <li class="clock_li">
            <img
              class="contact_icons clock_icon"
              src="./img/icons/clock.png"
              alt="clock icon"
            />Mon–Sat: 9:00–23:00
          </li>
        </ul>
      </footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
